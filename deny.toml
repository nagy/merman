[licenses]
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[[licenses.exceptions]]
name = "merman-elk-layered"
allow = ["EPL-2.0"]

# The `elk-layout` port and its `org-eclipse-elk-*` plugins declare
# `EPL-2.0 OR GPL-3.0-or-later`. Merman takes the EPL-2.0 arm, which keeps the
# MIT OR Apache-2.0 distribution story and the file-level copyleft boundary.
# A GPL-family consumer can take the other arm from the same crates.

